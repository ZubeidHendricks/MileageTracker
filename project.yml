# Generated by AppFactoryKit appgen. Run: xcodegen generate
name: MileageTracker
options:
  bundleIdPrefix: com.zubeid
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AppFactoryKit:
    url: https://github.com/ZubeidHendricks/AppFactoryKit
    from: "0.1.0"

targets:
  MileageTracker:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: AppFactoryKit
        product: AppFactoryKit
      - package: AppFactoryKit
        product: AppFactoryKitRevenueCat
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "MileageTracker"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "MileageTracker uses your location to measure trip distance for mileage logs."
    settings:
      base:
        PRODUCT_NAME: MileageTracker
        PRODUCT_BUNDLE_IDENTIFIER: com.zubeid.mileagetracker
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  MileageTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Sources/TripTracker.swift
    settings:
      base:
        PRODUCT_NAME: MileageTrackerTests
        PRODUCT_BUNDLE_IDENTIFIER: com.zubeid.mileagetracker.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"

schemes:
  Tests:
    build:
      targets:
        MileageTrackerTests: [test]
    test:
      targets:
        - MileageTrackerTests
